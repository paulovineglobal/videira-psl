services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - path: .env
        required: false
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/New_York}
      - TZ=${TZ:-America/New_York}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_DIAGNOSTICS_ENABLED=false
      # Necessário para acessar via http://localhost (especialmente no Safari).
      # Em produção com HTTPS, defina como true no .env.
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
    volumes:
      - n8n_data:/home/node/.n8n

  # WAHA: ponte não-oficial para enviar mensagens de WhatsApp (inclusive grupos).
  # Dashboard em http://localhost:3000/dashboard para conectar via QR code.
  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY:-videira-psl-local}
      - WHATSAPP_API_KEY=${WAHA_API_KEY:-videira-psl-local}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-videira2026}
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - TZ=${TZ:-America/New_York}
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media

volumes:
  n8n_data:
  waha_sessions:
  waha_media:
